<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FutuRole Quick Cover Letter Starter</title>
<meta name="description" content="Generate a tailored cover letter opening sentence in under 10 seconds with your job title and company name. No sign-up needed. Fast, easy, and professional." />
<style>
  :root {
    --color-bg-light: #ffffff;
    --color-text-light: #222222;
    --color-bg-dark: #121212;
    --color-text-dark: #e0e0e0;
    --color-primary: #007acc;
    --color-input-bg: #f0f0f0;
    --color-input-border: #ccc;
    --color-input-focus: var(--color-primary);
    --max-width: 600px;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background-color: var(--color-bg-dark);
      color: var(--color-text-dark);
    }
    input, button, textarea {
      background-color: #1e1e1e;
      border-color: #444;
      color: var(--color-text-dark);
    }
    input:focus, button:focus, textarea:focus {
      border-color: var(--color-input-focus);
      outline: none;
      box-shadow: 0 0 2px var(--color-input-focus);
    }
    a {
      color: #66aaff;
    }
    hr {
      border-color: #333;
    }
  }

  @media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) {
    body {
      background-color: var(--color-bg-light);
      color: var(--color-text-light);
    }
    input, button, textarea {
      background-color: var(--color-input-bg);
      border: 1px solid var(--color-input-border);
      color: var(--color-text-light);
    }
    input:focus, button:focus, textarea:focus {
      border-color: var(--color-input-focus);
      outline: none;
      box-shadow: 0 0 3px var(--color-input-focus);
    }
    a {
      color: var(--color-primary);
    }
    hr {
      border-color: #ddd;
    }
  }

  body {
    font-family: var(--font-family);
    margin: 0;
    padding: 1rem;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  main {
    max-width: var(--max-width);
    width: 100%;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
  }

  form {
    margin: 1rem 0 1.5rem 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  label {
    font-weight: 600;
  }

  input[type="text"] {
    padding: 0.5rem;
    font-size: 1rem;
    border-radius: 4px;
    width: 100%;
    box-sizing: border-box;
  }

  button {
    background-color: var(--color-primary);
    color: white;
    border: none;
    padding: 0.75rem;
    font-size: 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.25s ease;
  }

  button:hover,
  button:focus {
    background-color: #005fa3;
  }

  #result {
    margin-top: 1rem;
    padding: 1rem;
    background-color: var(--color-input-bg);
    border-radius: 4px;
    border: 1px solid var(--color-input-border);
    font-style: italic;
    min-height: 3rem;
  }

  section.explanation {
    margin-top: 2rem;
  }

  section.explanation > p {
    margin: 0.5rem 0 1.25rem 0;
  }

  section.faq {
    margin-top: 3rem;
  }

  section.faq h2 {
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
  }

  section.faq dl {
    margin: 0;
  }

  dt {
    font-weight: 700;
    margin-top: 1rem;
  }
